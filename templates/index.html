<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SasaGo — Лучший сервис в мире</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .hero-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px 100px;
        }

        .hero-title-main {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 32px;
            letter-spacing: -1.5px;
        }

        .sasavot-frame {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 380px;
            border-radius: 28px;
            overflow: hidden;
            background: #FFFFFF;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sasavot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sasavot-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="assets/sasavot.jpg" alt="SasaGo" class="logo-img">
                <span class="logo-text">SasaGo</span>
            </a>

            <nav class="nav-links">
                <a href="taxi.html" class="nav-tab">Такси</a>
                <a href="scooters.html" class="nav-tab">Самокаты</a>
                <a href="invest.html" class="nav-tab">Инвестиции</a>
            </nav>

            <div class="nav-actions">
                <span id="user-balance-badge" class="balance-badge" style="display: none;">
                    <span id="user-balance">0</span> б.
                </span>
                <button class="btn-login" id="auth-btn">Войти</button>
                <button class="btn-download">Скачать</button>
            </div>
        </div>
    </header>

    <main class="hero-center">
        <div class="badge" style="margin-bottom: 20px;">
            <span class="badge-dot"></span>
            SASA ЭКОСИСТЕМА
        </div>

        <h1 class="hero-title-main">
            SasaGo — <span class="orange-text">лучший сервис</span> в мире
        </h1>

        <div class="sasavot-frame">
            <img src="assets/sasvot.jpg" alt="Сасавот" class="sasavot-img" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex';">
            
            <div id="placeholder" class="sasavot-placeholder" style="display: none;">
                <span style="font-size: 48px; color: var(--orange-primary);">ZOV</span>
                <span>Место для фото Сасавота</span>
            </div>
        </div>
    </main>

    <script src="js/app-state.js"></script>
</body>
</html>
